name: Build macOS Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.label }} beta
    runs-on: macos-15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            miner_asset: mac-arm64
            artifact_arch: aarch64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            miner_asset: mac-intel
            artifact_arch: x86_64
            label: Intel
    env:
      MACOS_OFFICIAL_SIGNING_ENABLED: ${{ vars.MACOS_OFFICIAL_SIGNING_ENABLED || 'false' }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate macOS icon assets
        working-directory: apps/desktop
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Prepare integrated miner
        shell: bash
        env:
          MINER_ASSET: ${{ matrix.miner_asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MoneroOcean/xmrig/releases/latest)"
          download_url="$(printf '%s' "$release_json" | jq -r --arg asset "$MINER_ASSET" '.assets[] | select(.name | contains($asset)) | .browser_download_url' | head -1)"
          test -n "$download_url"
          work_dir="$(mktemp -d)"
          curl --fail --show-error --location "$download_url" -o "$work_dir/xmrig.tar.gz"
          tar -xzf "$work_dir/xmrig.tar.gz" -C "$work_dir"
          miner="$(find "$work_dir" -type f -name xmrig | head -1)"
          test -n "$miner"
          mkdir -p apps/desktop/src-tauri/resources/miner
          install -m 755 "$miner" apps/desktop/src-tauri/resources/miner/xmrig
          shasum -a 256 apps/desktop/src-tauri/resources/miner/xmrig | awk '{print $1}' > apps/desktop/src-tauri/resources/miner/xmrig.sha256
          file apps/desktop/src-tauri/resources/miner/xmrig
          lipo -info apps/desktop/src-tauri/resources/miner/xmrig

      - name: Validate source
        run: |
          pnpm --filter @velora/shared build
          pnpm --filter @velora/desktop typecheck
          pnpm --filter @velora/sdk test
          pnpm --filter @velora/desktop build
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Validate official signing configuration
        if: ${{ env.MACOS_OFFICIAL_SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Import Apple Developer ID certificate
        if: ${{ env.MACOS_OFFICIAL_SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-velora-ci-keychain}"
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain

      - name: Build macOS application
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MACOS_OFFICIAL_SIGNING_ENABLED" != "true" ]; then
            unset APPLE_SIGNING_IDENTITY
          fi
          pnpm exec tauri build --target "${{ matrix.target }}" --config src-tauri/tauri.macos.conf.json

      - name: Sign nested components and rebuild DMG
        if: ${{ env.MACOS_OFFICIAL_SIGNING_ENABLED != 'true' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/$TARGET/release/bundle"
          app="$bundle_root/macos/Velora.app"
          main_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          main_path="$app/Contents/MacOS/$main_executable"

          while IFS= read -r nested; do
            [ "$nested" = "$main_path" ] && continue
            if file "$nested" | grep -q 'Mach-O'; then
              chmod 755 "$nested"
              codesign --force --sign - "$nested"
            fi
          done < <(find "$app/Contents" -type f -perm -111 | sort)

          if [ -d "$app/Contents/Frameworks" ]; then
            while IFS= read -r framework; do
              codesign --force --sign - "$framework"
            done < <(find "$app/Contents/Frameworks" -depth -type d -name '*.framework')
          fi
          shasum -a 256 "$app/Contents/Resources/miner/xmrig" | awk '{print $1}' > "$app/Contents/Resources/miner/xmrig.sha256"
          codesign --force --sign - "$main_path"
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=4 "$app"

          old_dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)"
          final_dmg="$bundle_root/dmg/Velora_0.1.0_${ARTIFACT_ARCH}.dmg"
          staging="$(mktemp -d)"
          rm -f "$old_dmg" "$final_dmg"
          cp -R "$app" "$staging/Velora.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Velora -srcfolder "$staging" -ov -format UDZO "$final_dmg"

      - name: Notarize and staple DMG
        if: ${{ env.MACOS_OFFICIAL_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg="$(find "apps/desktop/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Verify packaged DMG
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/$TARGET/release/bundle"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)"
          mount_dir="$(mktemp -d)"
          report="releases/beta/macos/Velora_0.1.0_${ARTIFACT_ARCH}.diagnostics.txt"
          mkdir -p releases/beta/macos
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true' EXIT
          app="$mount_dir/Velora.app"
          plist="$app/Contents/Info.plist"
          main_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          main_path="$app/Contents/MacOS/$main_executable"
          miner_path="$app/Contents/Resources/miner/xmrig"
          fail() {
            echo "macOS verification failed: $1" >&2
            exit 1
          }

          plutil -lint "$plist" || fail "Info.plist is invalid"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          minimum_system_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")"
          echo "Bundle identifier: $bundle_identifier"
          echo "Minimum macOS version: $minimum_system_version"
          echo "Main executable: $main_path"
          echo "Integrated miner: $miner_path"
          [ "$bundle_identifier" = 'com.velora.desktop' ] || fail "unexpected bundle identifier $bundle_identifier"
          [ "$minimum_system_version" = '12.0' ] || fail "unexpected minimum macOS version $minimum_system_version"
          [ -x "$main_path" ] || fail "main executable is missing or not executable"
          [ -x "$miner_path" ] || fail "integrated miner is missing or not executable"
          expected_miner_hash="$(cat "$app/Contents/Resources/miner/xmrig.sha256")"
          actual_miner_hash="$(shasum -a 256 "$miner_path" | awk '{print $1}')"
          echo "Expected miner SHA-256: $expected_miner_hash"
          echo "Actual miner SHA-256: $actual_miner_hash"
          [ "$actual_miner_hash" = "$expected_miner_hash" ] || fail "integrated miner hash mismatch"
          expected_mach_arch="x86_64"
          if [ "$ARTIFACT_ARCH" = "aarch64" ]; then
            expected_mach_arch="arm64"
          fi
          main_file="$(file "$main_path")"
          miner_file="$(file "$miner_path")"
          echo "$main_file"
          echo "$miner_file"
          printf '%s' "$main_file" | grep -q "$expected_mach_arch" || fail "main executable is not $expected_mach_arch"
          printf '%s' "$miner_file" | grep -q "$expected_mach_arch" || fail "integrated miner is not $expected_mach_arch"
          codesign --verify --strict --verbose=4 "$app" || fail "codesign verification failed"
          {
            echo "Bundle: $app"
            plutil -p "$plist"
            file "$main_path"
            lipo -info "$main_path"
            file "$miner_path"
            lipo -info "$miner_path"
            otool -L "$main_path"
            codesign --display --verbose=4 "$app" 2>&1
            codesign --verify --strict --verbose=4 "$app" 2>&1
            spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
            xattr -l "$app" 2>&1 || true
          } > "$report"
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Publish build artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          mkdir -p releases/beta/macos/latest
          source_dmg="$(find "apps/desktop/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)"
          output_dmg="releases/beta/macos/latest/Velora_0.1.0_${ARTIFACT_ARCH}.dmg"
          cp "$source_dmg" "$output_dmg"
          shasum -a 256 "$output_dmg" > "$output_dmg.sha256.txt"
          cp "releases/beta/macos/Velora_0.1.0_${ARTIFACT_ARCH}.diagnostics.txt" releases/beta/macos/latest/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-macos-${{ matrix.artifact_arch }}-beta
          path: releases/beta/macos/latest
          if-no-files-found: error
