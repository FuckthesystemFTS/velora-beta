name: Build macOS Beta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS unsigned beta
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: macos-latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate macOS icon assets
        working-directory: apps/desktop
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Typecheck desktop
        run: pnpm --filter @velora/desktop typecheck

      - name: Test SDK
        run: pnpm --filter @velora/sdk test

      - name: Build desktop frontend
        run: pnpm --filter @velora/desktop build

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Import Apple Developer ID certificate
        if: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'velora-ci-keychain' }}
        run: |
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build macOS beta
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --config src-tauri/tauri.macos.conf.json

      - name: Notarize and staple DMG
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          find apps/desktop/src-tauri/target/release/bundle -type f -name "*.dmg" -print0 | while IFS= read -r -d '' dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Compute SHA-256
        shell: bash
        run: |
          mkdir -p releases/beta/macos/latest
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "releases/beta/macos/latest/$(basename "$file")"
            shasum -a 256 "$file" > "releases/beta/macos/latest/$(basename "$file").sha256.txt"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velora-macos-unsigned-beta
          path: releases/beta/macos/latest
          if-no-files-found: error
